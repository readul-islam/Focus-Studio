<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Clipper - Login</title>
  <link rel="stylesheet" href="login.css">
</head>
<body>
  <div class="container">
    <div class="login-card">
      <a target="_blank" href="https://techstyles.ai/" class="logo">
        <img class="logo-img" src="icons/techstyles-t-logo.png" alt="Logo">
        <span>Techstyles</span>
      </a>
      
      <h1>Product Clipper</h1>
      <p class="subtitle">Sign in to start clipping products to TechStyles</p>

      <form id="loginForm">
        <div class="form-group">
          <label for="email">Email</label>
          <input 
            type="email" 
            id="email" 
            name="email" 
            placeholder="your@email.com"
            required
            autocomplete="email"
          >
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input 
            type="password" 
            id="password" 
            name="password" 
            placeholder="••••••••"
            required
            autocomplete="current-password"
          >
        </div>

        <div id="errorMessage" class="error-message"></div>

        <button type="submit" id="loginBtn" class="login-btn">
          <span class="btn-text">Sign In</span>
          <span class="btn-loader"></span>
        </button>
      </form>

      <div class="footer">
        <p>Clip products from any website with AI-powered extraction</p>
      </div>
    </div>
  </div>

  <script src="api.js"></script>
  <script src="login.js"></script>
</body>
</html>
