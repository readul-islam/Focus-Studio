<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Clipper - Login</title>
  <link rel="stylesheet" href="login.css">
</head>
<body>
  <div class="container">
    <div class="login-card">
      <a target="_blank" href="https://focuspilot.io/" class="logo" aria-label="Focuspilot">
        <img class="logo-img" src="icons/brand.png" alt="Focuspilot">
      </a>

      <h1>Product Clipper</h1>
      <p class="subtitle" id="subtitle">Sign in to start clipping products to Focuspilot</p>

      <form id="loginForm">
        <div class="form-group">
          <label for="email">Email</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="your@email.com"
            required
            autocomplete="email"
          >
        </div>

        <div class="form-group" id="passwordGroup">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="••••••••"
            required
            autocomplete="current-password"
          >
        </div>

        <div class="form-group hidden" id="twoFactorGroup">
          <label for="totpCode">Authentication code</label>
          <input
            type="text"
            id="totpCode"
            name="totpCode"
            placeholder="123456"
            inputmode="numeric"
            autocomplete="one-time-code"
            maxlength="8"
          >
        </div>

        <div id="errorMessage" class="error-message" role="alert" aria-live="polite"></div>

        <button type="submit" id="loginBtn" class="login-btn">
          <span class="btn-text" id="loginBtnText">Sign In</span>
          <span class="btn-loader"></span>
        </button>

        <button type="button" id="backToLoginBtn" class="text-btn hidden">Back to sign in</button>
      </form>

      <div class="footer">
        <p>Clip products from any website with AI-powered extraction</p>
      </div>
    </div>
  </div>

  <script src="api.js"></script>
  <script src="login.js"></script>
</body>
</html>
