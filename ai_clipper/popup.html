<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Clipper</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <!-- Header -->
    <div class="header">
      <div class="header-left">
    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-sparkles-icon lucide-sparkles"><path d="M11.017 2.814a1 1 0 0 1 1.966 0l1.051 5.558a2 2 0 0 0 1.594 1.594l5.558 1.051a1 1 0 0 1 0 1.966l-5.558 1.051a2 2 0 0 0-1.594 1.594l-1.051 5.558a1 1 0 0 1-1.966 0l-1.051-5.558a2 2 0 0 0-1.594-1.594l-5.558-1.051a1 1 0 0 1 0-1.966l5.558-1.051a2 2 0 0 0 1.594-1.594z"/><path d="M20 2v4"/><path d="M22 4h-4"/><circle cx="4" cy="20" r="2"/></svg>
        <span class="header-title">Product Clipper</span>
      </div>
      <button id="settingsBtn" class="icon-btn" title="Settings">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-settings-icon lucide-settings"><path d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
    </div>

    <!-- Smart Fill Button -->
    <button id="smartFillBtn" class="smart-fill-btn">
   <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-sparkles-icon lucide-sparkles"><path d="M11.017 2.814a1 1 0 0 1 1.966 0l1.051 5.558a2 2 0 0 0 1.594 1.594l5.558 1.051a1 1 0 0 1 0 1.966l-5.558 1.051a2 2 0 0 0-1.594 1.594l-1.051 5.558a1 1 0 0 1-1.966 0l-1.051-5.558a2 2 0 0 0-1.594-1.594l-5.558-1.051a1 1 0 0 1 0-1.966l5.558-1.051a2 2 0 0 0 1.594-1.594z"/><path d="M20 2v4"/><path d="M22 4h-4"/><circle cx="4" cy="20" r="2"/></svg>
      <span>Smart fill from current page</span>
    </button>

    <!-- Images Section -->
    <div class="section">
      <div class="section-header">
        <span class="section-title">Images</span>
        <span id="imageCount" class="count">0</span>
      </div>
      <div id="imageGrid" class="image-grid">
        <div class="empty-state">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
            <circle cx="8.5" cy="8.5" r="1.5"/>
            <polyline points="21 15 16 10 5 21"/>
          </svg>
          <p>No images yet</p>
        </div>
      </div>
    </div>

    <form id="productForm">
      <!-- Basic Info -->
      <div class="section">
        <div class="section-header">
          <span class="section-title">Product Name</span>
        </div>
        <input type="text" id="name" placeholder="Product name" class="input-field">
      </div>

      <div class="section">
        <div class="section-header">
          <span class="section-title">Supplier</span>
        </div>
        <input type="text" id="supplier_name" placeholder="Supplier name" class="input-field">
      </div>

      <div class="section">
        <div class="section-header">
          <span class="section-title">Description</span>
        </div>
        <textarea id="description" placeholder="Product description" class="textarea-field" rows="3"></textarea>
      </div>

      <!-- Pricing -->
      <div class="section">
        <div class="section-header">
          <span class="section-title">Pricing</span>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="currency">Currency</label>
            <input type="text" id="currency" placeholder="Currency" class="input-field" style="width: 30%;">
          </div>
          <div class="form-group">
            <label class="form-label" for="trade_price">Trade Price</label>
            <input type="number" id="trade_price" placeholder="Trade Price" class="input-field" step="0.01" style="width: 33%;">
          </div>
          <div class="form-group">
            <label class="form-label" for="regular_price">Regular Price</label>
            <input type="number" id="regular_price" placeholder="Regular Price" class="input-field" step="0.01" style="width: 33%;">
          </div>
        </div>
      </div>

      <!-- Dimensions -->
      <div class="section">
        <div class="section-header">
          <span class="section-title">Dimensions & Weight</span>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="dimension">Dimensions</label>
            <input type="text" id="dimension" placeholder="Dimensions (e.g., 100x50x75 cm)" class="input-field">
          </div>
          <div class="form-group">
            <label class="form-label" for="weight">Weight</label>
            <input type="text" id="weight" placeholder="Weight (e.g., 25 kg)" class="input-field">
          </div>
          <div class="form-group">
            <label class="form-label" for="box_dimension">Box Dimensions</label>
            <input type="text" id="box_dimension" placeholder="Box Dimensions" class="input-field">
          </div>
        </div>
      </div>

      <!-- Seating Details -->
      <div class="section">
        <div class="section-header">
          <span class="section-title">Seating Details</span>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="seat_width">Seat Width</label>
            <input type="text" id="seat_width" placeholder="Seat Width" class="input-field">
          </div>
          <div class="form-group">
            <label class="form-label" for="seat_depth">Seat Depth</label>
            <input type="text" id="seat_depth" placeholder="Seat Depth" class="input-field">
          </div>
          <div class="form-group">
            <label class="form-label" for="seat_height">Seat Height</label>
            <input type="text" id="seat_height" placeholder="Seat Height" class="input-field">
          </div>
        </div>
      </div>

      <!-- Materials & Construction -->
      <div class="section">
        <div class="section-header">
          <span class="section-title">Materials & Construction</span>
        </div>
        <div class="form-ro">
          <div class="form-grou">
            <label class="form-label" for="materials">Materials</label>
            <input type="text" id="materials" placeholder="Materials" class="input-field">
          </div>
          <div class="mt-3">
            <label class="form-label" for="composition">Composition</label>
            <input type="text" id="composition" placeholder="Composition" class="input-field">
          </div>
          <div class="mt-3">
            <label class="form-label" for="construction">Construction</label>
            <input type="text" id="construction" placeholder="Construction" class="input-field">
          </div>
          <div class="mt-3">
            <label class="form-label" for="frame">Frame</label>
            <input type="text" id="frame" placeholder="Frame" class="input-field">
          </div>
          <div class="mt-3">
            <label class="form-label" for="filling">Filling</label>
            <input type="text" id="filling" placeholder="Filling" class="input-field">
          </div>
        </div>
      </div>

      <!-- Additional Details -->
      <div class="section">
        <div class="section-header">
          <span class="section-title">Additional Details</span>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="type">Product Type</label>
            <input type="text" id="type" placeholder="Product Type" class="input-field">
          </div>
          <div class="form-group">
            <label class="form-label" for="feet">Number of Feet</label>
            <input type="number" id="feet" placeholder="Number of Feet" class="input-field">
          </div>
        </div>
        
        <div class="checkbox-group" style="margin-top: 12px;">
          <label class="checkbox-label">
            <input type="checkbox" id="assembly_required">
            <span>Assembly Required</span>
          </label>
          <label class="checkbox-label">
            <input type="checkbox" id="removeable_cushion">
            <span>Removable Cushion</span>
          </label>
          <label class="checkbox-label">
            <input type="checkbox" id="removeable_legs">
            <span>Removable Legs</span>
          </label>
        </div>
      </div>

      <!-- Product URL (readonly) -->
      <div class="section">
        <div class="section-header">
          <span class="section-title">Product URL</span>
        </div>
        <input type="url" id="url" placeholder="https://" class="input-field" readonly>
      </div>
    </form>

    <!-- Action Buttons -->
    <div class="actions">
      <button id="clipBtn" class="btn btn-primary">Clip</button>
      <button id="clearBtn" class="btn btn-secondary">Clear</button>
    </div>

    <!-- Loading Overlay -->
    <!-- <div id="loadingOverlay" class="loading-overlay">
      <div class="spinner"></div>
      <p>Processing...</p>
    </div> -->
    <div id="loadingOverlay" class="loading-overlay">
  <div class="ai-loader"></div>
  <p class="ai-text">Loading...</p>
</div>

  </div>
  <script src="api.js"></script>
  <script src="popup.js"></script>
</body>
</html>
