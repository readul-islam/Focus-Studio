<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings - Product Clipper</title>
  <link rel="stylesheet" href="settings.css">
</head>
<body>
  <div class="container">
    <!-- Header -->
    <div class="header">
      <button id="backBtn" class="icon-btn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <path d="M19 12H5M12 19l-7-7 7-7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <h1>Settings</h1>
      <div style="width: 32px;"></div>
    </div>

    <!-- User Info Section -->
    <div class="section">
      <div class="section-header">
        <h2>Account</h2>
      </div>
      <div class="info-card">
        <div class="info-item">
          <span class="label">User</span>
         <div style="display: flex; flex-direction: column; gap: 4px; align-items: end; justify-content: end;">
          <span class="value" id="authStatus">Loading...</span>
          <span style="font-size: 11px;" class="value" id="authID">Loading...</span>
         </div>
        </div>
        <div class="info-item">
          <span class="label">Studio</span>
          <span class="value" id="studioName">-</span>
        </div>
      </div>
    </div>
    <!-- API Configuration -->
    <!-- <div class="section">
      <div class="section-header">
        <h2>API Configuration</h2>
      </div>
      <div class="info-card">
        <div class="info-item">
          <span class="label">Base URL</span>
          <span class="value mono">http://127.0.0.1:8000</span>
        </div>
      </div>
    </div>  -->

    <!-- Actions -->
    <div class="section">
      <button id="logoutBtn" class="logout-btn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <polyline points="16 17 21 12 16 7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <line x1="21" y1="12" x2="9" y2="12" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span>Logout</span>
      </button>
    </div>

    <!-- Footer -->
    <div class="footer">
      <p class="version">Focuspilot Product Clipper v1.0.1</p>
      <p class="copyright">© 2026 Focuspilot</p>
    </div>
  </div>

  <script src="api.js"></script>
  <script src="settings.js"></script>
</body>
</html>
