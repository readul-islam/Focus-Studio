# Deploy Django API to EC2 on push to main.
# Required GitHub repo secrets: EC2_HOST, EC2_USER, EC2_SSH_KEY
# Optional: EC2_APP_DIR (default /var/www/focus-studio)

name: Deploy API to EC2

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'scripts/ec2-deploy.sh'
      - '.github/workflows/deploy-ec2.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            APP_DIR="${{ secrets.EC2_APP_DIR }}"
            if [ -z "$APP_DIR" ]; then APP_DIR="/var/www/focus-studio"; fi
            cd "$APP_DIR"
            git fetch origin main
            git reset --hard origin/main
            chmod +x scripts/ec2-deploy.sh
            ./scripts/ec2-deploy.sh
